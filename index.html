<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a2438">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Hexwood</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1a24; font-family: Georgia, 'Times New Roman', serif; color: #3b2f2a; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; position: fixed; inset: 0; }
  button { font-family: inherit; cursor: pointer; }

  #topbar { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 8px; display: flex; gap: 6px; z-index: 5; }
  #topbar button { width: 48px; height: 48px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.5); background: rgba(250,244,230,0.88); font-size: 24px; box-shadow: 0 2px 6px rgba(0,0,0,0.25); }
  #status { position: fixed; top: calc(14px + env(safe-area-inset-top)); right: 10px; z-index: 5; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  #status span { background: rgba(250,244,230,0.88); border-radius: 10px; padding: 4px 10px; font-size: 15px; }
  #zonename { position: fixed; top: 22%; left: 0; right: 0; text-align: center; color: #fffbe8; font-size: 30px; font-style: italic; text-shadow: 0 2px 8px rgba(0,0,0,0.6); opacity: 0; pointer-events: none; z-index: 4; }
  #zonename.show { animation: zn 2.8s ease forwards; }
  @keyframes zn { 0% { opacity: 0; transform: translateY(8px); } 15% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; } }
  #toasts { position: fixed; top: calc(66px + env(safe-area-inset-top)); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 6; }
  .toast { background: rgba(250,244,230,0.94); padding: 7px 14px; border-radius: 12px; font-size: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); transition: opacity 0.6s, transform 0.6s; }
  .toast.out { opacity: 0; transform: translateY(-8px); }

  #topbar button { position: relative; }
  #topbar button.badge::after { content: ''; position: absolute; top: -4px; right: -4px; width: 16px; height: 16px; border-radius: 50%; background: #e85a7a; border: 2px solid #fff; animation: pop 1.2s infinite alternate; }
  @keyframes pop { to { transform: scale(1.2); } }
  .toast.notice { max-width: 88vw; font-size: 16px; border: 2px solid #c9a96e; background: #faf4e6; }
  .new { display: inline-block; background: #e85a7a; color: #fff; font-size: 11px; font-style: normal; padding: 1px 6px; border-radius: 6px; vertical-align: middle; }
  .page.compact { padding: 6px 12px; } .page.compact h3 { font-size: 16px; }
  button.side { padding: 6px 12px; font-size: 14px; border-radius: 10px; border: 2px dashed #c9a96e; background: #fffdf6; color: #5a4a2a; margin: 0 0 8px; }
  button.back { margin-bottom: 10px; }
  .spell .ic { position: relative; display: inline-block; width: 44px; text-align: center; }
  .ic.banded::before, .ic.banded::after { content: ''; position: absolute; left: 1px; right: 1px; top: 12px; height: 18px; border: 2px solid #b8c0cc; border-radius: 50%; box-shadow: 0 0 3px rgba(255,255,255,0.8); }
  .ic.banded::before { transform: rotate(32deg); } .ic.banded::after { transform: rotate(-32deg); }
  .logline { font-size: 14px; color: #6a5a4a; border-bottom: 1px solid #efe4cc; padding: 4px 0; }

  #dialog { position: fixed; left: 10px; right: 10px; top: calc(66px + env(safe-area-inset-top)); background: #faf4e6; border: 3px solid #c9a96e; border-radius: 16px; padding: 16px 18px 26px; font-size: 18px; line-height: 1.45; box-shadow: 0 4px 16px rgba(0,0,0,0.4); display: none; z-index: 10; max-width: 720px; margin: 0 auto; }
  #dialog.show { display: block; }
  #dtext b { color: #7b4fb6; }
  #dmore { position: absolute; right: 16px; bottom: 6px; color: #c9a96e; font-size: 14px; animation: bob 1s infinite alternate; }
  @keyframes bob { to { transform: translateY(3px); } }
  #dchoices { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  #dchoices button, .wide, .recipe button, .spell button { padding: 10px 18px; font-size: 17px; border-radius: 12px; border: 2px solid #8b7ad8; background: #ede8ff; color: #3b2f6a; }
  button:disabled { opacity: 0.4; }

  #panel { position: fixed; inset: calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom)); background: #faf4e6; border: 3px solid #c9a96e; border-radius: 18px; z-index: 9; display: none; flex-direction: column; max-width: 720px; margin: 0 auto; box-shadow: 0 6px 24px rgba(0,0,0,0.5); }
  #panel.show { display: flex; }
  #phead { display: flex; align-items: center; padding: 12px 14px 6px; border-bottom: 2px solid #e8d9b8; }
  #ptitle { flex: 1; font-size: 22px; }
  #pclose { width: 44px; height: 44px; border-radius: 12px; border: 2px solid #c9a96e; background: #fff; font-size: 20px; }
  #pbody { overflow-y: auto; padding: 10px 16px 18px; font-size: 16px; line-height: 1.4; touch-action: pan-y; }
  #pbody h3 { margin: 14px 0 6px; font-size: 18px; color: #7b4fb6; }
  #pbody h4 { margin: 10px 0 2px; font-size: 15px; color: #8a6a40; }
  #pbody ul { margin: 2px 0 6px; padding-left: 20px; }
  .muted { color: #8a7a6a; } .small { font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .item { background: #fff; border: 1px solid #e8d9b8; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .item .ic { font-size: 28px; } .item .nm { font-weight: bold; } .item .ds { font-size: 13px; color: #8a7a6a; }
  .item.unknown { opacity: 0.5; }
  .spell { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #e8d9b8; border-radius: 12px; padding: 10px; margin: 8px 0; }
  .spell .ic { font-size: 32px; } .spell .nm { flex: 1; font-weight: bold; } .charges { font-weight: normal; color: #7b6fd6; letter-spacing: 2px; font-size: 14px; }
  .page { background: #fffdf6; border: 1px solid #e8d9b8; border-radius: 12px; padding: 10px 14px; margin: 10px 0; }
  .page h3 { margin-top: 2px !important; } .pn { font-size: 13px; color: #b0956a; } .shape { font-size: 14px; color: #7b6fd6; margin-top: 4px; }
  .recipe { background: #fff; border: 1px solid #e8d9b8; border-radius: 12px; padding: 10px; margin: 8px 0; }
  .recipe .out { font-weight: bold; margin-bottom: 6px; }
  .recipe .needs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .needs span { padding: 3px 8px; border-radius: 8px; font-size: 14px; }
  .needs .have { background: #e3f4d8; } .needs .miss { background: #f6e1e1; }
  .clue { background: #fffdf6; border-left: 4px solid #c9a96e; padding: 8px 12px; margin: 6px 0; font-style: italic; }
  .clue.done { opacity: 0.6; border-color: #8fcf7a; }
  .plaque { font-style: italic; text-align: center; background: #f1e3c0; border-radius: 8px; padding: 8px; }
  .dials { display: flex; justify-content: center; gap: 14px; margin: 18px 0; }
  .dial { width: 74px; height: 74px; border-radius: 50%; border: 4px solid #c99a3e; background: #fff8e4; font-size: 36px; }
  .wide { display: block; margin: 0 auto; }

  #title { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: radial-gradient(circle at 50% 40%, #6f8f6a 0%, #3d5240 45%, #1d1a24 100%); color: #fffbe8; text-align: center; padding: 20px; }
  #title.hide { display: none; }
  #title h1 { font-size: 56px; margin: 0; font-weight: normal; letter-spacing: 2px; text-shadow: 0 3px 12px rgba(0,0,0,0.5); }
  #title p { margin: 0 0 14px; font-style: italic; opacity: 0.9; max-width: 340px; }
  #title button { width: 230px; padding: 14px; font-size: 21px; border-radius: 16px; border: 3px solid #fff6d8; background: linear-gradient(#a99cf0, #7b6fd6); color: #fff; }
  #ver { position: fixed; bottom: 10px; right: 14px; opacity: 0.6; font-size: 13px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="topbar">
  <button data-p="book" title="Spellbook">📖</button>
  <button data-p="satchel" title="Satchel">🎒</button>
  <button data-p="pouch" title="Spell Pouch">👝</button>
  <button data-p="journal" title="Journal">📜</button>
</div>
<div id="status"></div>
<div id="zonename"></div>
<div id="toasts"></div>
<div id="dialog"><div id="dtext"></div><div id="dchoices"></div><div id="dmore">More ▼</div></div>
<div id="panel"><div id="phead"><div id="ptitle"></div><button id="pclose">✕</button></div><div id="pbody"></div></div>
<div id="title">
  <h1>Hexwood</h1>
  <p>An adventure to find and help every creature while learning more about the power of magic.</p>
  <button id="btnCont">Continue</button>
  <button id="btnNew">New Game</button>
  <div id="ver"></div>
</div>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
</body>
</html>
